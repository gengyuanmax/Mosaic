tools:
- class_name: mosaic_gym.rl.tools.CropTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: crop
      description: 'Crop a rectangular region from one image, given as a normalized bounding box: corners
        x1,y1 (top-left) and x2,y2 (bottom-right), each in 0-1 (0.5 = image center). Use it to zoom into
        a region you have already visually located; avoid it when the region is not yet localized and
        the box would be guesswork.'
      parameters:
        type: object
        properties:
          x1:
            type: number
            minimum: 0
            maximum: 1
            description: Left edge of the crop box.
          y1:
            type: number
            minimum: 0
            maximum: 1
            description: Top edge of the crop box.
          x2:
            type: number
            minimum: 0
            maximum: 1
            description: Right edge of the crop box. Must be greater than x1.
          y2:
            type: number
            minimum: 0
            maximum: 1
            description: Bottom edge of the crop box. Must be greater than y1.
          target_image:
            type: string
            description: The stable visible image token of the image to crop, such as img1.
        required:
        - target_image
        - x1
        - y1
        - x2
        - y2
- class_name: mosaic_gym.rl.tools.RotateTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: rotate
      description: Rotate one image by an arbitrary angle in degrees. Use when orientation is the main
        uncertainty or to test a candidate angle; avoid when a simple flip is enough.
      parameters:
        type: object
        properties:
          angle:
            type: number
            minimum: -360
            maximum: 360
            description: Rotation angle in degrees for the target_image. Allowed range is [-360, 360].
              Use rotate mainly to test a concrete orientation hypothesis or a candidate angle from the
              task, rather than blindly trying arbitrary large angles.
          target_image:
            type: string
            description: The stable visible image token of the image to rotate, such as img1.
        required:
        - target_image
        - angle
- class_name: mosaic_gym.rl.tools.ResizeTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: resize
      description: Resize one image to an exact width and height in pixels. Use for a size-constrained
        or normalized view; avoid when you want a zoomed crop rather than a global resize (use crop).
      parameters:
        type: object
        properties:
          width:
            type: integer
            exclusiveMinimum: 0
            maximum: 4096
            description: Output width in pixels. Resize scales the whole image; do not treat width as
              a crop-box span or use an arbitrarily tiny size.
          height:
            type: integer
            exclusiveMinimum: 0
            maximum: 4096
            description: Output height in pixels. Together with width it sets the exact output size; the
              target_image is stretched or squashed if the aspect ratio changes.
          target_image:
            type: string
            description: The stable visible image token of the image to resize, such as img1.
        required:
        - target_image
        - width
        - height
- class_name: mosaic_gym.rl.tools.FlipTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: flip
      description: Flip one image horizontally or vertically. Use to mirror an image for easier comparison;
        avoid when you need an arbitrary rotation rather than a mirror.
      parameters:
        type: object
        properties:
          mode:
            type: string
            enum:
            - horizontal
            - vertical
            description: Flip axis. 'horizontal' flips left-to-right; 'vertical' flips top-to-bottom.
          target_image:
            type: string
            description: The stable visible image token of the image to flip, such as img1.
        required:
        - target_image
        - mode
- class_name: mosaic_gym.rl.tools.ApplyAffineTransformationTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: apply_affine_transformation
      description: Apply a 2D affine transform (rotation_angle, scale, translation_dx, translation_dy)
        to one image, given the four parameters. Use when the task provides concrete affine parameters
        to verify on an image; avoid when no such parameters exist, or when a 3x3 projective transform
        is needed (use apply_homography_transformation).
      parameters:
        type: object
        properties:
          rotation_angle:
            type: number
            minimum: -10000.0
            maximum: 10000.0
            description: Rotation angle in degrees.
          translation_dx:
            type: number
            minimum: -100000.0
            maximum: 100000.0
            description: Horizontal translation in pixels.
          translation_dy:
            type: number
            minimum: -100000.0
            maximum: 100000.0
            description: Vertical translation in pixels.
          scale:
            type: number
            minimum: -10000.0
            maximum: 10000.0
            description: Uniform scale factor. Must be non-zero.
          target_image:
            type: string
            description: The stable visible image token of the image to transform, such as img1.
        required:
        - target_image
        - rotation_angle
        - translation_dx
        - translation_dy
        - scale
- class_name: mosaic_gym.rl.tools.DrawNormalizedCoordinateGridTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: draw_normalized_coordinate_grid
      description: Draw a coordinate grid over one image as a spatial reference. Use for 'where in the
        image' questions about position, movement, or alignment; avoid when exact positions do not matter.
      parameters:
        type: object
        properties:
          grid_rows:
            type: integer
            exclusiveMinimum: 0
            maximum: 8
            description: Number of grid rows. Horizontal gridlines are labeled top-to-bottom with normalized
              y values 0.00, ..., 1.00 along the left edge. Choose grid_rows to match the spatial granularity
              the task needs — 4 for coarse regions, up to 8 for finer discrimination (denser grids reduce
              label readability).
          grid_cols:
            type: integer
            exclusiveMinimum: 0
            maximum: 8
            description: Number of grid columns. Vertical gridlines are labeled left-to-right with normalized
              x values 0.00, ..., 1.00 along the top edge. Choose grid_cols to match the spatial granularity
              the task needs; see grid_rows for sizing guidance.
          target_image:
            type: string
            description: The stable visible image token of the image to overlay the grid on, such as img1.
        required:
        - target_image
        - grid_rows
        - grid_cols
- class_name: mosaic_gym.rl.tools.ComparePerPixelImageDifferenceTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: compare_per_pixel_image_difference
      description: Return a heatmap of the exact per-pixel difference between two images (warmer = differ
        more, cool = identical or nearly so). Use for before/after or spot-the-difference between two
        related images; avoid when the two images are unrelated scenes.
      parameters:
        type: object
        properties:
          image1:
            type: string
            description: The stable visible image token of the first image to compare, such as img1.
          image2:
            type: string
            description: The stable visible image token of the second image to compare, such as img2.
              It must have the same pixel size as image1.
        required:
        - image1
        - image2
- class_name: mosaic_gym.rl.tools.ApplyHomographyTransformationTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: apply_homography_transformation
      description: Apply a 3x3 projective (homography) transform, given as 9 row-major numbers, to one
        image. Use to test whether a candidate homography matrix produces the expected result on an image,
        then compare the warped output with a reference; avoid when no candidate matrix is available,
        or when only rotation/scale/translation parameters are given (use apply_affine_transformation).
      parameters:
        type: object
        properties:
          matrix:
            type: array
            items:
              type: number
              minimum: -1000000.0
              maximum: 1000000.0
            minItems: 9
            maxItems: 9
            description: 'Row-major 3x3 projective transform as 9 numbers. It maps target_image coordinates
              to output coordinates: ``p_out = matrix · p_in``. Copy the values verbatim from the chosen
              candidate, including scientific-notation terms like -2.0912e-05.'
          target_image:
            type: string
            description: The stable visible image token of the image to warp, such as img1.
        required:
        - target_image
        - matrix
- class_name: mosaic_gym.rl.tools.MakeCollageTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: make_collage
      description: Arrange several images into a single image as a rows x cols grid. Use to view multiple
        images side by side for comparison; avoid when a single image is enough.
      parameters:
        type: object
        properties:
          rows:
            type: integer
            exclusiveMinimum: 0
            maximum: 8
            description: Number of rows in the M×N layout. Set to 1 for a horizontal strip, to len(target_images)
              for a vertical strip, or to any value such that rows * cols >= len(target_images) for a
              rectangular grid.
          cols:
            type: integer
            exclusiveMinimum: 0
            maximum: 8
            description: Number of columns in the M×N layout. Set to len(target_images) for a horizontal
              strip, to 1 for a vertical strip, or to any value such that rows * cols >= len(target_images)
              for a rectangular grid.
          target_images:
            type: array
            items:
              type: string
            minItems: 2
            description: Stable visible image tokens such as img1, img2. Select 2 or more images to lay
              out; they fill the M×N grid in row-major order (left-to-right then top-to-bottom). Read
              the user prompt carefully and order target_images deliberately — do not blindly reuse the
              original input order.
        required:
        - target_images
        - rows
        - cols
- class_name: mosaic_gym.rl.tools.OverlayImagesTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: overlay_images
      description: Paste the foreground image onto the background at normalized position (x, y) and return
