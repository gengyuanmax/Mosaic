[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-gym"
version = "0.1.0"
description = "Agentic multi-image understanding environment"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MosaicGym Team" }]
dependencies = [
  "httpx>=0.27",
  "openai>=1.0",
  "numpy>=1.24",
  "Pillow>=10.0",
  "opencv-python>=4.8",
  "prompt-toolkit>=3.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
  "mypy>=1.8",
]
strict = [
  "pydantic>=2.6",
  "pyarrow>=15.0",
]

[project.scripts]
mosaic-run = "mosaic_gym.runner.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
